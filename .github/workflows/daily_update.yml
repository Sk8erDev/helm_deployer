name: Daily Dependency Update, SAST Scan and Docker Build

on:
  schedule:
    # Запуск ежедневно в 04:00 UTC (07:00 MSK)
    - cron: '0 4 * * *'
  workflow_dispatch: # Возможность ручного запуска из интерфейса GitHub

permissions:
  contents: write
  security-events: write

jobs:
  update-dependencies:
    name: Check Updates, SAST Scan and Build
    runs-on: ubuntu-latest
    environment: TG_ENVS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Trivy (SAST / Vulnerability Scanner)
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Run SAST check on Dockerfile (Misconfiguration)
        run: |
          echo "=== Running SAST check on Dockerfile ==="
          trivy config Dockerfile --severity HIGH,CRITICAL --exit-code 0

      - name: Run update script, security scan and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKER_USR: ${{ secrets.DOCKER_USR }}
          DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
        run: |
          python3 updater.py

      - name: Upload Trivy SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-analysis'

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add Dockerfile
            git commit -m "chore: auto-update Dockerfile dependencies and security fixes"
            git push
          else
            echo "No changes detected. Nothing to commit."
          fi
